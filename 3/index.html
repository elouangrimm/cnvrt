<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CnVrt — The Daily Converter</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta name="description" content="A fast, minimal, on-device file converter.">
    <meta name="color-scheme" content="light">
    <link rel="stylesheet" href="3/style-newspaper.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Spectral:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.0/dist/ffmpeg.min.js"></script>
</head>

<body>
    <div class="newspaper-texture"></div>

    <div class="container" id="drop-area">
        <div class="content-wrapper">
            <div class="masthead">
                <div class="masthead-rule thick"></div>
                <div class="masthead-meta">
                    <span class="edition">EST. 2024</span>
                    <span class="dateline" id="dateline"></span>
                    <span class="edition">ON-DEVICE</span>
                </div>
                <h1>CnVrt</h1>
                <div class="masthead-tagline">THE UNIVERSAL FILE CONVERTER</div>
                <div class="masthead-rule thin"></div>
            </div>

            <h2 id="subtitle">A fast, minimal, and on-device file converter for almost any file type.</h2>
            <h2 id="funny-subtitle" style="display: none;"></h2>

            <div id="initial-state">
                <p id="upload-instruction">Drag & drop a file or select one below</p>
                <button id="select-file-btn" class="action-btn">Select File</button>
                <p id="engine-loader"></p>
            </div>

            <input type="file" id="file-input" accept="
                .jpg, .jpeg, .png, .gif, .bmp, .tiff, .webp, .svg, .ico, .heic, .heif, .psd,
                .mp4, .mkv, .webm, .mov, .avi, .flv, .wmv,
                .mp3, .wav, .aac, .m4a, .ogg, .flac, .wma,
                .pdf, .epub, .docx, .html, .txt,
                .xlsx, .xls, .csv,
                .zip, .tar, .gz,
                .ttf, .otf, .woff, .woff2" />

            <div class="file-preview" id="file-preview"></div>

            <div id="conversion-controls" style="display: none;">
                <div id="resize-controls" style="display: none;">
                    <div class="resize-header">
                        <label class="checkbox-container">
                            <input type="checkbox" id="resize-enable">
                            <span class="checkmark"></span>
                            Resize Image
                        </label>
                    </div>
                    <div id="resize-inputs" class="disabled">
                        <div class="resize-row">
                            <div class="input-group">
                                <label for="resize-width">Width</label>
                                <input type="number" id="resize-width" min="1" disabled>
                                <span>px</span>
                            </div>
                            <div class="resize-link">
                                <button id="resize-lock-btn" class="icon-btn active" title="Unlock Aspect Ratio">🔒</button>
                            </div>
                            <div class="input-group">
                                <label for="resize-height">Height</label>
                                <input type="number" id="resize-height" min="1" disabled>
                                <span>px</span>
                            </div>
                        </div>
                        <div class="resize-row">
                            <label class="checkbox-container">
                                <input type="checkbox" id="resize-pixel-art" disabled>
                                <span class="checkmark"></span>
                                Pixel Art Mode (Nearest Neighbor)
                            </label>
                        </div>
                    </div>
                </div>

                <label class="conversion-label">Select output format:</label>
                <div id="format-buttons" class="format-button-group"></div>
            </div>

            <div id="progress-container" style="display: none;">
                <progress id="progress-bar" value="0" max="100"></progress>
                <span id="progress-text"></span>
            </div>

            <div id="finished-state" style="display: none;">
                <p id="finished-text">Conversion complete!</p>
                <a id="download-link" class="action-btn" download>Download File</a>
                <button id="reset-btn" class="action-btn secondary">Convert Another File</button>
            </div>
            <footer id="app-footer">
                <div class="footer-rule"></div>
                <div class="footer-content">
                    <a href="https://elouan.xyz" target="_blank">elouan.xyz</a>
                    <span>§</span>
                    <a href="https://github.com/elouangrimm/cnvrt" target="_blank">github</a>
                </div>
            </footer>
        </div>
    </div>

    <script src="/script.js"></script>
    <script>
        // Set the dateline to current date
        const d = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('dateline').textContent = d.toLocaleDateString('en-US', options).toUpperCase();
    </script>
</body>

</html>
